services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cowork-index-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "CoWork!2024Strong"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - cowork_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cowork-index-api
    restart: unless-stopped
    environment:
      DATABASE_URL: "mssql+aioodbc://sa:CoWork!2024Strong@sqlserver:1433/ai_usage_maturity?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&MARS_Connection=yes"
      DATABASE_URL_SYNC: "mssql+pyodbc://sa:CoWork!2024Strong@sqlserver:1433/ai_usage_maturity?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&MARS_Connection=yes"
      SCHEDULER_ENABLED: "true"
      # Bağlayıcı ayarları (.env dosyasından okunur; boşsa varsayılanlar geçerli)
      CAPTURE_CONTENT: "${CAPTURE_CONTENT:-true}"
      SIGNAL_CLASSIFIER: "${SIGNAL_CLASSIFIER:-auto}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}"
      LOCAL_TIMEZONE: "${LOCAL_TIMEZONE:-Europe/Istanbul}"
    ports:
      - "8000:8000"
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      sh -c "python -m scripts.ensure_database &&
             python -m alembic upgrade head &&
             uvicorn src.main:app --host 0.0.0.0 --port 8000"

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cowork-index-dashboard
    restart: unless-stopped
    environment:
      API_BASE_URL: "http://api:8000"
      DISPLAY_TIMEZONE: "${DISPLAY_TIMEZONE:-Europe/Istanbul}"
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: >
      streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501

  # Copilot Chat canlı akışı: Copilot'ta hook olmadığı için VS Code'un yerel
  # oturum klasörü salt-okunur bağlanır ve 10 sn'de bir değişiklik aranır.
  copilot-watcher:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cowork-index-copilot-watcher
    restart: unless-stopped
    environment:
      VSCODE_USER_DIR: /vscode
      COWORK_API_BASE_URL: "http://api:8000"
      COWORK_EMPLOYEE_NAME: "${COWORK_EMPLOYEE_NAME:-Burak Önce}"
      COWORK_TEAM_NAME: "${COWORK_TEAM_NAME:-Veri & Analitik}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - "${VSCODE_USER_DIR_HOST:-${APPDATA}/Code/User}:/vscode:ro"
      - cowork_watcher_state:/root/.cowork_index
    depends_on:
      - api
    command: python -m connectors.copilot_chat.watcher --interval 10

volumes:
  cowork_mssql_data:
  cowork_watcher_state:
